<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Painel do Barbeiro — Barbearia Dom Felipe</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts: Bebas Neue (títulos e logo) + Poppins (corpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="Barbearia Dom Felipe">
        <span class="logo-top">Barbearia</span>
        <span class="logo-bottom"><span class="logo-dom">Dom</span> <span class="logo-felipe">Felipe</span></span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">
        <i class="ph ph-arrow-left" aria-hidden="true"></i> Voltar ao site
      </a>
    </div>
  </header>

  <!-- ===================== LOGIN ===================== -->
  <main class="section login-section">
    <div class="container">
      <div class="login-card">
        <i class="ph ph-lock-key login-icon" aria-hidden="true"></i>
        <p class="eyebrow center">Acesso restrito</p>
        <h1 class="section-title center login-title">Área do Barbeiro</h1>
        <p class="section-sub center">Entre com suas credenciais para gerenciar os agendamentos do dia.</p>

        <form id="loginForm" class="login-form" novalidate>
          <div class="form-group">
            <label for="loginEmail">E-mail</label>
            <input type="email" id="loginEmail" name="email" placeholder="seuemail@dominio.com" required>
          </div>
          <div class="form-group">
            <label for="loginSenha">Senha</label>
            <input type="password" id="loginSenha" name="senha" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Entrar</button>
          <p class="form-note" id="loginNote" role="status"></p>
        </form>

        <p class="login-hint">
          Protótipo (MVP) — acesso de teste: <code>admin@domfelipe.com</code> / <code>123</code>
        </p>
      </div>
    </div>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="index.html" class="logo footer-logo" aria-label="Barbearia Dom Felipe">
        <span class="logo-top">Barbearia</span>
        <span class="logo-bottom"><span class="logo-dom">Dom</span> <span class="logo-felipe">Felipe</span></span>
      </a>
      <p>&copy; <span id="anoLogin"></span> Barbearia Dom Felipe. Painel interno — uso exclusivo da equipe.</p>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
